{% extends "base.html" %}
{% block content %}

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #36b9cc, #f6c23e);
}

.register-container {
  background: white;
  padding: 35px;
  border-radius: 15px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  width: 380px;
  margin: 80px auto;
  text-align: center;
}

input {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  padding: 10px;
  background: #1cc88a;
  border: none;
  color: white;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #17a673;
}

a {
  display: block;
  margin-top: 15px;
  text-decoration: none;
  color: #1cc88a;
}
</style>

<div class="register-container">
  <h2>Create Account</h2>

  <form method="POST">
    <input name="username" type="text" placeholder="Full Name" required>
    <input name="email" type="email" placeholder="Email" required>
    <input name="password" type="password" placeholder="Password" required>

    <button type="submit">
        Capture Face & Register
    </button>
  </form>

  <a href="{{ url_for('login') }}">Already have an account? Login</a>
</div>

{% endblock %}
